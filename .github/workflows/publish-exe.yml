# name of workflow
name: Build and Upload Artifact

# triggers
on:
  workflow_dispatch:
    inputs:
        version:
          description: 'Version Number (e.g., 1.0.1)'
          required: true
          default: '1.0.0'
        configuration:
          description: 'Build Configuration'
          required: true
          default: 'Release'
          type: choice
          options:
          - Release
          - Debug

# what to do
jobs:
  build:
    runs-on: windows-latest
    
    # values for the build
    env:
      RID: win-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.1.3

    # restore the project
    - name: Restore the project
      run: msbuild "Windows Diagnostic Tools.csproj" /t:Restore /p:Configuration=${{ github.event.inputs.configuration }} /p:RuntimeIdentifier=$env:RID

    # create the app (self-contained)
    - name: Create the app (Self-Contained)
      run: msbuild "Windows Diagnostic Tools.csproj" /t:Publish /p:Configuration=${{ github.event.inputs.configuration }} /p:RuntimeIdentifier=$env:RID /p:WindowsAppSDKSelfContained=true /p:WindowsPackageType=None /p:EnableMsixTooling=true /p:PublishDir=./publish/$env:RID/
    
    # zip the app
    - name: Create ZIP File
      run: Compress-Archive -Path ./publish/$env:RID/* -DestinationPath ./publish/Unpackaged-EXE-x64.zip
      
    # Create Release
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v6
      with:
        name: Windows-Diagnostic-Tools-${{ github.event.inputs.version }}-${{ github.event.inputs.configuration }}-x64 # adds version and configuration, i.e. Windows-Diagnostic-Tools-2.0.1-Release-x64
        path: ./publish/Unpackaged-EXE-x64.zip

    # Clean up
    - name: Clean-up
      if: always() # Ensures this runs even if previous steps failed
      run: Remove-Item -Path ./publish/ -Recurse -Force
